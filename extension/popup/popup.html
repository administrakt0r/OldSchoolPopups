<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="win-header">
    <span>🪟 RetroPop 98 - Popups Everywhere</span>
  </div>
  <div class="win-body">
    <div class="status-box">
      Status: <strong id="status-text" style="color: green;">ACTIVE</strong>
    </div>
    <button id="toggle-btn" class="main-btn">PAUSE NOSTALGIA</button>
    <div class="options">
      <label><input type="checkbox" id="sound-chk" checked> PC Speaker Sounds</label><br>
      <label><input type="checkbox" id="hydra-chk" checked> Hydra Mode (Close 1 = 2!)</label>
    </div>
    <div class="actions">
      <button id="spawn-now-btn">⚡ Spawn Popup Now</button>
      <button id="clear-all-btn">🧹 Clear Popups</button>
    </div>
    <div class="footer-note">
      Relive 1998 cyberspace on any website!
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
